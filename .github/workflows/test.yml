name: Test Suite

# Every push runs the suite, including feature branches. There is no pull
# request step here — work merges to main locally — so a branch first checked
# after that merge is checked too late to act on.
#
# Every ref gets the full matrix. It costs about 24 seconds of wall clock over
# a single job — 93s against 69s, measured — which is not worth trading
# cross-platform coverage for. The matrix earns its place because local
# verification is macOS on a single Node version, and the VSIX is consumed by
# Linux devcontainers.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Superseded runs on the same ref are pointless once a newer commit exists, and
# feature branches get pushed repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-core:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: npm
    - run: npm ci
    - name: Install verified bd 1.2.2 Linux binary
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bd-1.2.2"
        cd "$RUNNER_TEMP/bd-1.2.2"
        BASE=https://github.com/gastownhall/beads/releases/download/v1.2.2
        curl --fail --location --retry 3 "$BASE/beads_1.2.2_linux_amd64.tar.gz" -o beads_1.2.2_linux_amd64.tar.gz
        curl --fail --location --retry 3 "$BASE/checksums.txt" -o checksums.txt
        printf '%s  %s\n' '25507c2d3ac43d17a1e7dc6ea25141b0354300cebf3f3f549b7ba3d266ee4f69' checksums.txt | sha256sum --check --strict
        sha256sum --check --ignore-missing checksums.txt
        tar -xzf beads_1.2.2_linux_amd64.tar.gz
        ./bd version
        echo "$RUNNER_TEMP/bd-1.2.2" >> "$GITHUB_PATH"
    - run: npm run test:shared:boundaries
    - run: npm run test:shared
    - run: npm run test:shared:integration

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run VS Code extension tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run -a npm test

    - name: Run VS Code extension tests (non-Linux)
      if: runner.os != 'Linux'
      run: npm test

    - name: Verify VSIX package builds
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
      run: |
        npx @vscode/vsce package --no-dependencies
        FILECOUNT=$(npx @vscode/vsce ls *.vsix 2>/dev/null | wc -l)
        echo "VSIX contains $FILECOUNT files"
        # A tripwire for the bundler collapsing back to unbundled output, which
        # lands in the hundreds. Deliberately looser than the range RELEASING.md
        # has you eyeball at release time, so ordinary additions do not fail CI.
        if [ "$FILECOUNT" -gt 50 ]; then
          echo "ERROR: VSIX has too many files ($FILECOUNT). Expected under 50. Bundling may be broken."
          exit 1
        fi
